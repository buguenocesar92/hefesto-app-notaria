; ---------------------------------------------------------------------------
; nginx de la API.
; ---------------------------------------------------------------------------
; Solo sirve la API. El navegador nunca llega aca por el puerto 8080 en
; produccion: Caddy es el unico que publica puertos.
;
; Puerto 8080 y no 80: corre como usuario sin privilegios, y un usuario sin
; privilegios no puede abrir puertos por debajo de 1024.
; ---------------------------------------------------------------------------

server {
    listen 8080;
    server_name _;

    root /var/www/html/public;

    # Datos de personas: los archivos temporales de una subida no se pueden
    # dejar en un directorio accesible.
    client_max_body_size 64m;
    client_body_temp_path /var/www/html/storage/framework/uploads;
    client_body_buffer_size 256k;

    # Una peticion que se corta a mitad de una subida no puede dejar un
    # archivo a medias en el volumen de documentos.
    client_body_timeout 120s;
    send_timeout 120s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/notaria.access.log;
    error_log  /var/log/nginx/notaria.error.log warn;

    # En produccion, Laravel se sirve con `artisan route:cache` y la cache de
    # vistas compilada: nginx no ejecuta PHP, php-fpm lo hace.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        include fastcgi_params;

        # Tiempos largos: una subida de un documento o una consulta al tablero
        # con muchas filas pueden tardar.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Los archivos subidos nunca se ejecutan: un `.php` en el volumen de
    # documentos se descarga o se rechaza, no se interpreta.
    location ~* \.(php|phtml|phar)$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}