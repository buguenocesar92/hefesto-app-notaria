; ---------------------------------------------------------------------------
; supervisor: php-fpm, la cola y el semaforo dentro del contenedor de la API.
; ---------------------------------------------------------------------------
; Tres procesos, en lugar de tres contenedores, porque los tres necesitan el
; mismo codigo y la misma configuracion, y porque la transicion del contexto de
; notaria tiene que funcionar igual en todos.
;
; EL SEMAFORO CORRE AQUI, NO EN UN CRON DEL SISTEMA
; ------------------------------------------------
; El comando `notaria:revisar-semaforo` recorre las etapas de todas las
; notarias y abre o actualiza las alertas. Ver docs/01.

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=hefesto

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cola]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --verbose
directory=/var/www/html
autostart=true
autorestart=true
priority=20
user=hefesto
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:semaforo]
command=bash -c "while true; do php /var/www/html/artisan notaria:revisar-semaforo; sleep 3600; done"
directory=/var/www/html
autostart=true
autorestart=true
priority=30
user=hefesto
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0