; ---------------------------------------------------------------------------
; Ajustes de PHP para la API de notarias.
; ---------------------------------------------------------------------------

; --- Errores --------------------------------------------------------------
; En produccion, `APP_DEBUG=false` hace que Laravel no muestre errores al
; usuario. Esta directiva es la segunda barrera: si algo se escapa de Laravel,
; PHP tampoco lo muestra.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log
error_reporting = E_ALL

; --- Fecha y hora ---------------------------------------------------------
; La hora de Chile tiene horario de verano. Dejarla en UTC y convertir en la
; aplicacion seria un paso donde se puede perder una hora de un dia; mejor que
; la zona horaria este bien puesta desde el arranque.
date.timezone = America/Santiago

; --- Memoria y limites ---------------------------------------------------
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20

; --- Sesion ---------------------------------------------------------------
; La cookie de sesion viaja con una cookie HttpOnly y SameSite. SameSite evita
; que una peticion hecha desde otro sitio use una sesion de este sistema.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1

; --- Seguridad ------------------------------------------------------------
; `expose_php` en el header X-Powered-By le dice a un atacante la version
; exacta de PHP con solo mirar una respuesta.
expose_php = Off

; --- Opcache --------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; --- Compilacion ----------------------------------------------------------
; ctype se usa en la validacion de entradas.
extension=ctype

; --- Limites de conexiones ------------------------------------------------
max_input_vars = 3000